<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Jankenpon!</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>_Jankenpon!</h1>

    <div id="score">
        <h2>Score</h2>
        <div class="score-container">
            <p>Player: <span id="player-score">0</span></p>
            <p>Computer: <span id="computer-score">0</span></p>
        </div>
        <p id="result-message">Choose your weapon!</p>
        <h2 id="final-winner"></h2>
    </div>

    <div id="options">
        <button class="btn" value="rock">ROCK</button>
        <button class="btn" value="paper">PAPER</button>
        <button class="btn" value="scissors">SCISSORS</button>
    </div>
</body>

</html>
