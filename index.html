<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>_Jankenpon!</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>_Jankenpon!</h1>

    <div id="display">
        <div id="computer-choice"></div>
        <h2 id="final-winner">-</h2>
        <p id="result-message">Choose your weapon!</p>
        <div class="score-container">
            <h2>Score</h2>
            <span>Player: <span id="player-score">0</span></span>
            <span>Computer: <span id="computer-score">0</span></span>
        </div>
    </div>

    <div id="options">
        <button class="btn" value="ROCK">✊</button>
        <button class="btn" value="PAPER">✋</button>
        <button class="btn" value="SCISSORS">✌️</button>
    </div>
</body>

</html>
